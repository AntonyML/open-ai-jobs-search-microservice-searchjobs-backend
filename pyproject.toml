[project]
name = "open-ai-jobs-search-microservice-searchjobs-backend"
version = "0.1.0"
description = "Microservicio de ingesta de ofertas de empleo via Telegram"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.0.0",
    "telethon>=1.37.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "alembic>=1.13.0",
    "structlog>=24.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["sessions*", "scripts*"]
